app-id: io.github.VanglDev.LexSentinel

runtime: org.kde.Platform
runtime-version: "6.8"

sdk: org.kde.Sdk

command: lexsentinel-gui

build-options:
  build-args:
    - --share=network

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home

modules:
  - name: lexsentinel
    buildsystem: simple

    build-commands:
      - pip3 install --prefix=/app .
      - install -Dm644 flatpak/lexsentinel.desktop /app/share/applications/io.github.VanglDev.LexSentinel.desktop
      - install -Dm644 assets/icon-flatpak.png /app/share/icons/hicolor/256x256/apps/io.github.VanglDev.LexSentinel.png

    sources:
      - type: dir
        path: ..